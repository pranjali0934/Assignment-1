<div class="summary-view">
  <div class="summary-controls">
    <label>
      Year
      <input type="number" [(ngModel)]="year" name="summaryYear" />
    </label>
    <label>
      Month
      <input type="number" min="1" max="12" [(ngModel)]="month" name="summaryMonth" />
    </label>
    <button type="button" (click)="load()">Load summary</button>
  </div>

  @if (summary(); as s) {
    <h3>Total: ₹{{ s.total }}</h3>
    <table>
      <thead>
        <tr>
          <th>Category</th>
          <th>Spent</th>
          <th>Budget Limit</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (c of s.byCategory; track c.category) {
          <tr [class.over-budget]="c.overBudget">
            <td>{{ c.category }}</td>
            <td>₹{{ c.total }}</td>
            <td>{{ c.budgetLimit !== null ? '₹' + c.budgetLimit : '—' }}</td>
            <td>{{ c.overBudget ? 'Over budget' : 'OK' }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
