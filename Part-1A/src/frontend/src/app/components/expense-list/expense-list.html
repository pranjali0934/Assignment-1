<app-expense-filter (filterChanged)="onFilterChanged($event)" />

<app-expense-form [editingExpense]="editingExpense()" (saved)="onSaved()" />
@if (editingExpense()) {
  <button type="button" (click)="cancelEdit()">Cancel edit</button>
}

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Category</th>
      <th>Amount</th>
      <th>Description</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (expense of expenses(); track expense.id) {
      <tr>
        <td>{{ expense.date }}</td>
        <td>{{ expense.category }}</td>
        <td>₹{{ expense.amount }}</td>
        <td>{{ expense.description }}</td>
        <td>
          <button type="button" (click)="edit(expense)">Edit</button>
          <button type="button" (click)="delete(expense)">Delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>
